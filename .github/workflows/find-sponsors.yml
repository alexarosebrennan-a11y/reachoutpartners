name: ReachOut Sponsor Research

# Weekly automated run of the find-sponsors research pass, plus manual trigger.
# NOTE: the `schedule` trigger only fires for workflows that exist on the
# repository's default branch — this won't run on a schedule until this
# workflow file is merged there.
on:
  schedule:
    - cron: "34 14 * * 4" # Every Thursday at 14:34 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: reachout-sponsor-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run sponsor research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat .github/ci-research-prompt.md)" --dangerously-skip-permissions

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sheets sync dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync new prospects to Google Sheet (append-only)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: python scripts/sync_to_sheet.py

      - name: Commit and push updated prospect list
        run: |
          git config user.name "reachout-sponsor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Automated weekly sponsor research update"
          git push
